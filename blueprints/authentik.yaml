# Declarative initial setup for Authentik 2026.5, applied automatically by the
# authentik-worker container. Authentik only re-applies a blueprint when its
# file content changes, so the entrypoint (scripts/authentik-entrypoint.sh)
# forces a re-apply on every container start to pick up a rotated ngrok URL.
# Environment references use !Env, which reads the authentik-server/worker
# container environment (populated by docker-compose from .env).
#
# NOTE: this Authentik version's !Env tag takes a flow sequence
# (!Env [KEY, DEFAULT]); a scalar "!Env KEY, default" would be treated as a
# single literal variable name and never resolve.
#
# Skipped (entry conditions) when the referenced variables are empty:
#   * the forward-auth provider + application + outpost binding require
#     AUTHENTIK_APP_EXTERNAL_HOST (the nginx-served app URL) — auto-discovered
#     from the ngrok tunnel by the container entrypoint
#     (scripts/authentik-entrypoint.sh);
#   * the admin API token requires AUTHENTIK_ADMIN_API_TOKEN;
#   * each beta user requires its AUTHENTIK_BETA_USER_n_* username.
version: 1

metadata:
  name: Diabetes Chatbot - provider, token, branding, beta users
  labels:
    blueprints.goauthentik.io/description: Diabetes Chatbot forward-auth provider, admin API token, default-brand customization and beta users.

entries:
  # Forward auth (single application) proxy provider. external_host must equal
  # the URL users reach the app at (the nginx host), including scheme and any
  # non-default port. The outpost matches the X-Original-URL nginx sends against
  # this value, and uses it to build the /outpost.goauthentik.io/callback URL.
  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Diabetes Chatbot Forward Auth
    conditions:
      - !Env [AUTHENTIK_APP_EXTERNAL_HOST, ""]
    attrs:
      name: Diabetes Chatbot Forward Auth
      external_host: !Env [AUTHENTIK_APP_EXTERNAL_HOST, ""]
      mode: forward_single
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      basic_auth_enabled: false
    id: proxy-provider

  # Application bound to the provider (appears on the user's "My applications"
  # page and exposes the provider through the outpost).
  - model: authentik_core.application
    identifiers:
      slug: diabetes-chatbot
    conditions:
      - !Env [AUTHENTIK_APP_EXTERNAL_HOST, ""]
    attrs:
      name: Diabetes Chatbot
      slug: diabetes-chatbot
      provider: !KeyOf proxy-provider

  # Assign the provider to the embedded outpost (outpost.providers is an M2M;
  # the embedded outpost ships empty so replacing the list is safe). The outpost
  # config's authentik_host must be the URL the browser reaches Authentik at:
  # the embedded outpost uses it to rewrite browser-facing URLs (the OAuth
  # authorize endpoint), while backchannel calls stay on localhost. Without it
  # the /start redirect points at http://localhost.
  - model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    conditions:
      - !Env [AUTHENTIK_APP_EXTERNAL_HOST, ""]
    attrs:
      config:
        authentik_host: !Env [AUTHENTIK_APP_EXTERNAL_HOST, ""]
      providers:
        - !KeyOf proxy-provider

  # Service-account token with a known key (from env) so the backend can call
  # the Admin API for account deletion without manual setup.
  - model: authentik_core.token
    identifiers:
      identifier: authentik-admin-api
    conditions:
      - !Env [AUTHENTIK_ADMIN_API_TOKEN, ""]
    attrs:
      identifier: authentik-admin-api
      user: !Find [authentik_core.user, [username, akadmin]]
      intent: api
      key: !Env [AUTHENTIK_ADMIN_API_TOKEN, ""]

  # Default-brand customization (the "authentik-default" brand applies to every
  # unmatched domain). Put any brand CSS below the branding_custom_css key.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: Diabetes Chatbot
      branding_custom_css: |
        /* Custom brand CSS for the Authentik login/logout interface. */

  # Beta users group. Members are attached via each user's `groups` list so a
  # user entry whose environment variables are unset can be skipped without
  # breaking the group.
  - model: authentik_core.group
    identifiers:
      name: beta_users
    attrs:
      name: beta_users
    id: beta-group

  - model: authentik_core.user
    identifiers:
      username: !Env [AUTHENTIK_BETA_USER_1_USERNAME, ""]
    conditions:
      - !Env [AUTHENTIK_BETA_USER_1_USERNAME, ""]
    attrs:
      username: !Env [AUTHENTIK_BETA_USER_1_USERNAME, ""]
      name: !Env [AUTHENTIK_BETA_USER_1_NAME, ""]
      email: !Env [AUTHENTIK_BETA_USER_1_EMAIL, ""]
      is_active: true
      password: !If [!Env [AUTHENTIK_BETA_PASSWORD, ""], !Env [AUTHENTIK_BETA_PASSWORD, ""], null]
      groups:
        - !KeyOf beta-group

  - model: authentik_core.user
    identifiers:
      username: !Env [AUTHENTIK_BETA_USER_2_USERNAME, ""]
    conditions:
      - !Env [AUTHENTIK_BETA_USER_2_USERNAME, ""]
    attrs:
      username: !Env [AUTHENTIK_BETA_USER_2_USERNAME, ""]
      name: !Env [AUTHENTIK_BETA_USER_2_NAME, ""]
      email: !Env [AUTHENTIK_BETA_USER_2_EMAIL, ""]
      is_active: true
      password: !If [!Env [AUTHENTIK_BETA_PASSWORD, ""], !Env [AUTHENTIK_BETA_PASSWORD, ""], null]
      groups:
        - !KeyOf beta-group
