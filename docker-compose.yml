services:
  redis:
    image: redis:alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

  # Backend API - FastAPI service exposing chatbot functionality. Auth and the
  # SQL database are cloud-hosted on Supabase: the backend verifies the JWT
  # access tokens presented by the frontend and queries Supabase Postgres over
  # the pooled connection (DATABASE_URL).
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (postgresql+psycopg://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require)}
      - CHAT_CACHE_REDIS_URL=${CHAT_CACHE_REDIS_URL:-redis://redis:6379/1}
      - CHAT_CACHE_TTL_SECONDS=${CHAT_CACHE_TTL_SECONDS:-300}
      - PYTHONPATH=/app
      # Supabase Auth: JWT verification against the public JWKS endpoint. The
      # secret key used for account deletion lives only in the Supabase
      # delete-account edge function.
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL must be set}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL must be set}
    volumes:
      - ./data/processed:/app/data/processed
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ngrok tunnel exposing the ui nginx over the public internet. Pinned to a
  # free static dev domain (NGROK_STATIC_DOMAIN) so the URL never rotates:
  # Supabase email-confirmation redirects are allowlisted against it, and the
  # frontend's localStorage session is origin-scoped to it.
  ngrok:
    image: ngrok/ngrok:alpine
    restart: unless-stopped
    command: http --url=${NGROK_STATIC_DOMAIN:?NGROK_STATIC_DOMAIN must be set (your ngrok static dev domain)} https://ui:443
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set}
      - NGROK_CONFIG=/etc/ngrok.yml
    volumes:
      - ./scripts/ngrok.yml:/etc/ngrok.yml:ro

  # UI - React frontend
  ui:
    build:
      context: .
      dockerfile: dockerfile.ui
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_REQUEST_TIMEOUT_MS=${VITE_REQUEST_TIMEOUT_MS:-60000}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    env_file: .env
    ports:
      # HTTP :3000 redirects to HTTPS :443 (TLS terminated here, see dockerfile.ui).
      - "${UI_HTTP_PORT:-3000}:80"
      - "${UI_HTTPS_PORT:-443}:443"
    volumes:
      # Optional: mount real certs as ./certs/server.crt + ./certs/server.key.
      # Without them a self-signed cert is generated at container start.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /api/health is unauthenticated; --insecure is acceptable for
      # container-internal localhost traffic (self-signed or real certs).
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --insecure https://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
