services:
  redis:
    image: redis:alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set (e.g. diabetes_chatbot)}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set (e.g. diabetes_chatbot)}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend API - FastAPI service exposing chatbot functionality
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (postgresql+psycopg://<user>:<strong_password>@postgres:5432/<db>)}
      - CHAT_CACHE_REDIS_URL=${CHAT_CACHE_REDIS_URL:-redis://redis:6379/1}
      - CHAT_CACHE_TTL_SECONDS=${CHAT_CACHE_TTL_SECONDS:-300}
      - DEV=${DEV:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a strong secret (>= 32 chars)}
      - EMBEDDING_BINDING_HOST=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - EMBEDDING_API_KEY=${OPENROUTER_API_KEY}
      - PYTHONPATH=/app
      - BOOTSTRAP_USERS=${BOOTSTRAP_USERS:-}
    volumes:
      - ./data/processed:/app/data/processed
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # UI - React frontend
  ui:
    build:
      context: .
      dockerfile: dockerfile.ui
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_REQUEST_TIMEOUT_MS=${VITE_REQUEST_TIMEOUT_MS:-60000}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  postgres_data: