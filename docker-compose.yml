services:
  redis:
    image: redis:alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

  # PocketBase - self-hosted auth + app database (SQLite). The React UI
  # authenticates against it through the ui nginx /pb proxy; the backend
  # verifies the HS256 access tokens locally (users collection signing
  # secret) and reads/writes conversations/messages via the superuser API.
  # Data lives in ./data/pocketbase; schema and the optional Supabase import
  # run as JSVM migrations from backend/data/pb_migrations/ on first boot.
  pocketbase:
    build:
      context: .
      dockerfile: dockerfile.pocketbase
    restart: unless-stopped
    environment:
      - POCKETBASE_SUPERUSER_EMAIL=${POCKETBASE_SUPERUSER_EMAIL:?POCKETBASE_SUPERUSER_EMAIL must be set}
      - POCKETBASE_SUPERUSER_PASSWORD=${POCKETBASE_SUPERUSER_PASSWORD:?POCKETBASE_SUPERUSER_PASSWORD must be set}
    volumes:
      - ./data/pocketbase:/pb/pb_data
      - ./backend/data/pb_migrations:/pb/pb_migrations:ro
      # Custom JSVM routes (token introspection used by the backend).
      - ./backend/data/pb_hooks:/pb/pb_hooks:ro
      # Optional one-shot Supabase export (scripts/export_supabase_data.sql).
      - ./data/pb_import:/pb/import:ro
    command:
      - sh
      - -c
      - |
        pocketbase superuser upsert --dir=/pb/pb_data "$$POCKETBASE_SUPERUSER_EMAIL" "$$POCKETBASE_SUPERUSER_PASSWORD" &&
        exec pocketbase serve --http=0.0.0.0:8090 --dir=/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Backend API - FastAPI service exposing chatbot functionality. Auth tokens
  # are verified locally against the PocketBase users signing secret; app data
  # is accessed through the PocketBase superuser API.
  backend:
    build:
      context: .
      dockerfile: dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      - CHAT_CACHE_REDIS_URL=${CHAT_CACHE_REDIS_URL:-redis://redis:6379/1}
      - CHAT_CACHE_TTL_SECONDS=${CHAT_CACHE_TTL_SECONDS:-300}
      - PYTHONPATH=/app
      # PocketBase Auth: local JWT verification with the users collection
      # signing secret; account deletion uses the superuser API below.
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
      - POCKETBASE_SUPERUSER_EMAIL=${POCKETBASE_SUPERUSER_EMAIL:?POCKETBASE_SUPERUSER_EMAIL must be set}
      - POCKETBASE_SUPERUSER_PASSWORD=${POCKETBASE_SUPERUSER_PASSWORD:?POCKETBASE_SUPERUSER_PASSWORD must be set}
    volumes:
      - ./data/processed:/app/data/processed
    depends_on:
      redis:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ngrok tunnel exposing the ui nginx over the public internet. Pinned to a
  # free static dev domain (NGROK_STATIC_DOMAIN) so the URL never rotates;
  # the frontend's localStorage session is origin-scoped to it.
  ngrok:
    image: ngrok/ngrok:alpine
    restart: unless-stopped
    command: http --url=${NGROK_STATIC_DOMAIN:?NGROK_STATIC_DOMAIN must be set (your ngrok static dev domain)} https://ui:443
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set}
      - NGROK_CONFIG=/etc/ngrok.yml
    volumes:
      - ./scripts/ngrok.yml:/etc/ngrok.yml:ro

  # UI - React frontend served by nginx, which also proxies /api -> backend
  # and /pb -> pocketbase so everything stays same-origin (no third-party CSP
  # entries needed).
  ui:
    build:
      context: .
      dockerfile: dockerfile.ui
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_REQUEST_TIMEOUT_MS=${VITE_REQUEST_TIMEOUT_MS:-60000}
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-/pb}
    restart: unless-stopped
    env_file: .env
    ports:
      # HTTP :3000 redirects to HTTPS :443 (TLS terminated here, see dockerfile.ui).
      - "${UI_HTTP_PORT:-3000}:80"
      - "${UI_HTTPS_PORT:-443}:443"
    volumes:
      # Optional: mount real certs as ./certs/server.crt + ./certs/server.key.
      # Without them a self-signed cert is generated at container start.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /api/health is unauthenticated; --insecure is acceptable for
      # container-internal localhost traffic (self-signed or real certs).
      test: ["CMD-SHELL", "curl -fsS -o /dev/null --insecure https://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
